version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: scope
    groups:
      # Patch and minor bumps arrive as one reviewable PR rather than a dozen.
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
    ignore:
      # TypeScript is pinned below 6 because typescript-eslint@8 peer-caps there.
      # Revisit deliberately, not by bot.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns:
          - '*'
    labels:
      - dependencies
      - ci
