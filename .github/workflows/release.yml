name: Release

on:
  push:
    tags: ['v*']
  # For re-running a submission without cutting a new tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, zip, publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # To create the GitHub Release and upload the ZIP to it.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        id: version
        # A tag that disagrees with the manifest version produces a release whose
        # name is a lie, and a store submission that is hard to trace back.
        #
        # A release candidate is the exception. Chrome manifest versions are
        # dot-separated integers only, so `package.json` cannot carry an `-rc.1`
        # suffix; the candidate is checked against the base version instead, and
        # is marked a prerelease rather than submitted.
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          PKG="v$(node -p "require('./package.json').version")"
          case "$TAG" in
            "$PKG")
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "Releasing $TAG"
              ;;
            "$PKG"-alpha.* | "$PKG"-beta.* | "$PKG"-rc.*)
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "Releasing $TAG as a prerelease of $PKG"
              ;;
            *)
              echo "::error::Tag $TAG does not match package.json ($PKG). Bump one of them, or tag a candidate as $PKG-rc.1."
              exit 1
              ;;
          esac

      # The full CI gate again, on the exact commit being published. CI having
      # passed on the branch is not the same as passing on this tag.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Guard permissions and no-network claims
        run: pnpm guard

      - name: Check bundle budgets
        run: pnpm size

      - name: Zip for the Chrome Web Store
        run: pnpm zip

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          # Empty for a real release, so the flag below expands to nothing.
          PRERELEASE: ${{ steps.version.outputs.prerelease == 'true' && '1' || '' }}
        # `gh` ships on the runner, so this needs no third-party action and no
        # extra SHA to keep current.
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            ${PRERELEASE:+--prerelease} \
            .output/*-chrome.zip

      - name: Submit to the Chrome Web Store
        # Skipped rather than failed when the secrets are absent, so forks and
        # dry runs still exercise everything above this line. A candidate is
        # skipped too: an RC exists to test this workflow, not to reach users,
        # and a submitted version number cannot be reused.
        if: env.CHROME_EXTENSION_ID != '' && steps.version.outputs.prerelease != 'true'
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: pnpm wxt submit --chrome-zip .output/*-chrome.zip

      - name: Note when publishing was skipped
        if: env.CHROME_EXTENSION_ID == '' || steps.version.outputs.prerelease == 'true'
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            echo "::notice::${{ inputs.tag || github.ref_name }} is a release candidate, so the ZIP was attached to the prerelease but not submitted to the store. See docs/PUBLISHING.md."
          else
            echo "::notice::Store secrets are not configured, so the ZIP was attached to the release but not submitted. See docs/PUBLISHING.md."
          fi
