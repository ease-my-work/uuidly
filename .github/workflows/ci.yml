name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege by default. Jobs that need more ask for it themselves.
permissions:
  contents: read

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Actions are pinned to commit SHAs, not tags. A tag can be moved to point
      # at different code; a SHA cannot. Dependabot keeps them current.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        # Version comes from `packageManager` in package.json.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        # --frozen-lockfile fails rather than silently resolving a different tree
        # than the one that was reviewed. Also runs `wxt prepare` via postinstall,
        # which typecheck depends on.
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        # Vitest never runs tsc, so a green test run is not evidence the code
        # compiles. This step has already caught a real error the tests missed.
        run: pnpm typecheck

      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Guard permissions and no-network claims
        # Reads .output/, so it must come after the build. Enforces what
        # SECURITY.md promises instead of leaving it as prose.
        run: pnpm guard

      - name: Check bundle budgets
        run: pnpm size

  dependency-review:
    name: Dependency review
    # Only meaningful on a pull request: it diffs the manifest against the base.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # A two-dependency runtime is a deliberate property of this project,
          # so a new one should be argued for in the PR, not slipped in.
          comment-summary-in-pr: on-failure
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0, LGPL-2.0, LGPL-2.1, LGPL-3.0
